<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--acc:#0d9488;--hd:#fff;--bg:#efeae2;--in:#fff;--out:color-mix(in srgb,var(--acc) 18%,#fff);--tx:#111b21;--sub:#667781;--line:rgba(0,0,0,.09)}
:root[data-theme=dark]{--hd:#1f2c34;--bg:#0b141a;--in:#202c33;--out:color-mix(in srgb,var(--acc) 50%,#0b141a);--tx:#e9edef;--sub:#8696a0;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd6d4;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--tx)}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
svg{fill:currentColor;display:block}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24;user-select:none;flex:none}
[hidden]{display:none!important}
#fx{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) brightness(.7) saturate(1.3)}
.app{position:fixed;left:0;right:0;top:0;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background-color:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.4)}
header{display:flex;align-items:center;gap:2px;padding:6px 4px;padding-top:max(6px,env(safe-area-inset-top));background:var(--hd);flex:none;border-bottom:1px solid var(--line)}
header .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
header .ib{padding:9px;border-radius:50%;color:var(--tx)}
.gav{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.ttl{min-width:0}.ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pin{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;background:var(--hd);border-bottom:1px solid var(--line);font-size:13.5px;text-align:left;flex:none}
#pin span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pin em{font-style:normal;font-weight:700;color:#fff;background:var(--acc);border-radius:10px;padding:2px 9px;font-size:12px}
#menu{position:absolute;top:52px;right:8px;z-index:20;background:var(--hd);border-radius:12px;box-shadow:0 6px 28px rgba(0,0,0,.3);padding:6px 0;min-width:190px}
#menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 18px;font-size:15.5px}#menu .ms{color:var(--sub)}#menu button:hover{background:var(--line)}
#chat{flex:1;overflow-y:auto;padding:8px 12px 8px;overscroll-behavior:contain}
.chip{width:fit-content;max-width:92%;margin:10px auto;padding:5px 11px;border-radius:8px;background:color-mix(in srgb,var(--in) 92%,transparent);color:var(--sub);font-size:12.5px;text-align:center;box-shadow:0 1px .5px rgba(0,0,0,.12)}
.chip.y{background:#fff3c4;color:#54460a}
:root[data-theme=dark] .chip.y{background:#182229;color:#ffd279}
.row{display:flex;align-items:flex-start;gap:8px;margin:2px 0;animation:pop .18s ease-out}
.row.first{margin-top:9px}.row.out{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.av,.sp0{width:32px;height:32px;border-radius:50%;flex:none}
.av{object-fit:cover;cursor:pointer;box-shadow:0 0 0 1.5px var(--bg),0 0 0 3.5px var(--acc)}
.bub{position:relative;max-width:min(80%,380px);padding:6px 8px 5px;border-radius:9px;background:var(--in);box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:15px;line-height:1.35;word-wrap:break-word}
.row.out .bub{background:var(--out)}
.bub.tl::before{content:"";position:absolute;top:0;width:9px;height:13px;background:inherit}
.row.in .bub.tl{border-top-left-radius:0}.row.in .bub.tl::before{left:-8px;clip-path:polygon(100% 0,0 0,100% 100%)}
.row.out .bub.tl{border-top-right-radius:0}.row.out .bub.tl::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.nm{font-size:13px;font-weight:600;margin-bottom:2px}
.t{white-space:pre-wrap}
.meta{float:right;margin:6px 0 -2px 10px;font-size:11px;color:var(--sub);display:flex;gap:3px;align-items:center}
.tick{color:var(--sub);display:inline-flex}.row.read .tick{color:#53bdeb}
.react{position:absolute;right:8px;bottom:-13px;background:var(--in);border-radius:12px;padding:0 5px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.typing .bub{padding:11px 12px}.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.inv{min-width:min(72vw,300px)}
.ban{margin:-6px -8px 8px;padding:34px 14px 18px;border-radius:9px 9px 0 0;color:#fff;text-align:center;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.7)),var(--img) center/cover}
.ban small{font-size:12px;letter-spacing:.14em;opacity:.9}.ban h3{margin:4px 0;font:700 36px/1.05 "Cormorant Garamond",Georgia,serif}.ban p{margin:0;font-size:14px}
.rw{display:flex;gap:10px;padding:5px 2px;font-size:14px;line-height:1.3}.rw .ms{width:24px;text-align:center;font-size:21px;color:var(--acc)}.map .rw{padding:2px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px;text-align:center}
.cd div{background:linear-gradient(160deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:#fff;border-radius:9px;padding:7px 0}.cd b{display:block;font-size:21px;font-variant-numeric:tabular-nums}.cd small{font-size:11px;opacity:.85}
.map{min-width:min(72vw,300px)}.map iframe{width:100%;height:150px;border:0;border-radius:7px;display:block;margin-bottom:6px}
.map a{display:block;text-align:center;color:var(--acc);font-weight:600;text-decoration:none;padding:7px;border-top:1px solid var(--line);margin-top:5px}
.vn{display:flex;align-items:center;gap:8px;min-width:min(60vw,250px)}
.vn .pb{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:28px}.wave i{flex:1;background:var(--sub);opacity:.45;border-radius:2px}.wave i.pl{background:var(--acc);opacity:1}
.vn small{font-size:11.5px;color:var(--sub);min-width:30px}.vn img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.bank{position:relative;overflow:hidden;border-radius:13px;padding:14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(0,0,0,.28);min-width:min(70vw,290px);margin:3px 0 5px}
.bank::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.13)}
.bank .bt{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.05em}
.chipi{width:36px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f6dc87,#c9a227)}
.bank .num{font:600 22px/1.2 ui-monospace,Menlo,Consolas,monospace;margin:16px 0 10px;letter-spacing:.05em}
.bank .bb{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;position:relative;z-index:1}.bank small{display:block;opacity:.8;font-size:11px}
.cp{background:#fff;color:#111;font-weight:600;font-size:13px;border-radius:16px;padding:7px 14px;display:inline-flex;align-items:center;gap:5px}.bn{font-size:20px;color:var(--ac,#fff)}
#qr{display:flex;gap:8px;overflow-x:auto;padding:6px 10px 2px;scrollbar-width:none;flex:none}#qr::-webkit-scrollbar{display:none}
.qb{flex:none;border:1px solid var(--acc);color:var(--acc);background:var(--in);border-radius:17px;padding:7px 13px;font-size:14px;white-space:nowrap;font-weight:500}
.gi{flex:1;overflow:auto}
.gtop{text-align:center;padding:24px 16px 18px;background:var(--hd)}
.gp{width:132px;height:132px;border-radius:50%;object-fit:cover;cursor:pointer}
.gtop h2{margin:14px 0 4px;font-size:22px;font-weight:600}.gtop p{margin:0;color:var(--sub)}
.sec{background:var(--hd);margin-top:8px;padding:12px 16px}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh2 button{color:var(--sub);display:flex;align-items:center;gap:2px}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.strip img{width:88px;height:88px;border-radius:8px;object-fit:cover;flex:none;cursor:pointer}
.cap{display:block;color:var(--sub);font-size:13.5px;margin-bottom:6px}
.mb{display:flex;align-items:center;gap:14px;width:100%;padding:8px 0;text-align:left}.mb img,.ini{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.ini{background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px}.mb small{display:block;color:var(--sub);font-size:13px}
footer{display:flex;align-items:flex-end;gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));flex:none}
.inp{flex:1;display:flex;align-items:center;gap:8px;background:var(--in);border-radius:24px;padding:3px 14px;min-height:46px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font:inherit;font-size:16px;padding:9px 0}
.inp input::placeholder{color:var(--sub)}.inp span{color:var(--sub);font-size:20px}
#send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}#send:disabled{opacity:.6}
#cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;background:#0b2f2c;transition:opacity .6s,visibility .6s}
#cover.gone{opacity:0;visibility:hidden}
#cover .bgi{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.4) saturate(1.15)}
#cover .pat{position:absolute;inset:0;opacity:.5}
#cover .fr{position:absolute;inset:14px;border:1px solid rgba(255,215,140,.6);border-radius:20px}#cover .fr::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,215,140,.28);border-radius:15px}
#cover .cc{position:relative;padding:26px;max-width:420px}
.pair{display:flex;justify-content:center;margin-bottom:18px}.pair img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid #ffd78c;box-shadow:0 8px 24px rgba(0,0,0,.45)}.pair img+img{margin-left:-20px}
.cc small{letter-spacing:.22em;text-transform:uppercase;opacity:.9;font-size:12.5px}
.cc h1{font:700 clamp(46px,14vw,72px)/1 "Cormorant Garamond",Georgia,serif;margin:12px 0 6px;color:#fff3d6}
.cc p{margin:4px 0}
.to{margin:22px auto 0;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);width:fit-content;max-width:100%}.to span{display:block;font-size:12.5px;opacity:.85}.to b{font-size:21px}
#open{margin-top:26px;background:#ffd78c;color:#3a2a00;font-weight:700;border-radius:30px;padding:15px 36px;font-size:16.5px;box-shadow:0 0 0 0 rgba(255,215,140,.7);animation:glow 2s infinite}
@keyframes glow{70%{box-shadow:0 0 0 16px rgba(255,215,140,0)}100%{box-shadow:0 0 0 0 rgba(255,215,140,0)}}
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;max-width:520px;margin:0 auto}
#ov.blk{background:#000;color:#fff}
.oh{display:flex;align-items:center;gap:12px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:var(--hd);font-size:18px;font-weight:600}.oh button{padding:6px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}.grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.big{position:absolute;inset:0;background:#000;display:grid;place-items:center}.big img{max-width:100%;max-height:100%}.big button{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;color:#fff;background:rgba(0,0,0,.5);border-radius:50%;padding:8px}
.story{flex:1;position:relative;display:flex;align-items:center;justify-content:center}.story .sp{max-width:100%;max-height:100%;object-fit:contain}
.bars{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:4px;z-index:2}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}.bars b{display:block;height:100%;width:0;background:#fff}.bars .d b{width:100%}.bars .a b{animation:fill 4.5s linear forwards}
@keyframes fill{to{width:100%}}
.sh{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 14px);left:10px;right:10px;display:flex;align-items:center;gap:10px;z-index:3;color:#fff;text-shadow:0 1px 3px #000}
.sh img{width:36px;height:36px;border-radius:50%;object-fit:cover}.sh span{opacity:.8;font-size:13px;flex:1}.sh button{color:#fff}
.story u{position:absolute;top:70px;bottom:0;width:40%;z-index:1}.story u.l{left:0}.story u.r{right:0}
.call{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;background:#0b1a1a;overflow:hidden;text-align:center}
.call .cb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45)}
.call video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.call .top{position:relative;margin-top:max(40px,env(safe-area-inset-top));z-index:1;text-shadow:0 1px 4px #000}.top h2{margin:0;font-size:24px;font-weight:500}.top p{margin:4px 0;opacity:.85}
.call .av2{position:relative;display:flex;margin-top:60px;z-index:1}.av2 img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.7)}.av2 img+img{margin-left:-28px}
.ring .av2 img{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
.call .ctl{position:absolute;bottom:max(36px,env(safe-area-inset-bottom));display:flex;gap:22px;z-index:1}
.ctl button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}.ctl .end{background:#ea3a3a}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);z-index:90;background:#202c33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.fall{position:fixed;top:-30px;z-index:95;font-size:26px;pointer-events:none;animation:f 2.6s ease-in forwards}@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
.flash .bub{animation:fl 1.2s}@keyframes fl{30%{box-shadow:0 0 0 4px var(--acc)}}
@media(prefers-reduced-motion:reduce){.row,.fall,#open{animation:none}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="cover"><div class="bgi"></div><div class="pat"></div><div class="fr"></div>
  <div class="cc"><div class="pair"><img id="c1" alt=""><img id="c2" alt=""></div><small>Undangan Pernikahan</small><h1 id="cn"></h1><p id="cd"></p>
  <div class="to"><span>Kepada</span><b id="cg"></b></div><br><button id="open">Buka Undangan</button></div></div>

<div class="app" id="app">
  <header>
    <button class="ib" id="back" aria-label="Kembali"></button>
    <button class="who" id="grp"><img class="gav" id="gav" alt=""><div class="ttl"><b id="gt"></b><small id="gs"></small></div></button>
    <button class="ib" id="vid" aria-label="Video call"></button>
    <button class="ib" id="tel" aria-label="Telepon"></button>
    <button class="ib" id="more" aria-label="Menu"></button>
  </header>
  <div id="menu" hidden><button id="mm"></button><button id="mt"></button><button id="mg"></button></div>
  <button id="pin" hidden><b class="ms" style="font-size:19px;color:var(--acc)">push_pin</b><span id="pt"></span><em id="pe"></em></button>
  <main id="chat"></main>
  <div id="qr" hidden></div>
  <footer>
    <div class="inp"><input id="in" placeholder="Ketik pesan" autocomplete="off" enterkeyhint="send"></div>
    <button id="send" aria-label="Kirim"></button>
  </footer>
</div>
<div id="ov" hidden></div><div id="toast"></div>

<script src="config.js"></script>
<script>
const C = CONFIG, E = C.event, root = document.documentElement;
const $ = (s) => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const P = { g: { ...C.groom, col: "#53bdeb", k: "g" }, b: { ...C.bride, col: "#e26ab6", k: "b" } };
const GROUP = `${P.g.name} & ${P.b.name}`;
const qs = new URLSearchParams(location.search);
const guest = (qs.get("to") || qs.get("nama") || "").trim().slice(0, 40) || "Tamu";
const IC = { back: "arrow_back", tel: "call", vid: "videocam", more: "more_vert", send: "send", play: "play_arrow", pause: "pause", x: "close", end: "call_end", lock: "lock", copy: "content_copy", sun: "light_mode", moon: "dark_mode", on: "music_note", off: "music_off", mic: "mic_off", vol: "volume_up", group: "group", ok: "done_all", chev: "chevron_right" };
const ic = (n, s = 24) => `<span class="ms" style="font-size:${s}px">${IC[n]}</span>`;

/* ---------- setup ---------- */
root.style.setProperty("--acc", C.accent);
document.title = `Undangan Pernikahan ${GROUP}`;
$("#cover .bgi").style.backgroundImage = $("#fx").style.backgroundImage = `url(${C.cover})`;
$("#c1").src = P.g.avatar; $("#c2").src = P.b.avatar; $("#cn").textContent = GROUP; $("#cd").textContent = `${E.dateText} · ${E.timeText}`; $("#cg").textContent = guest;
$("#gav").src = C.groupPhoto; $("#gt").textContent = "Wedding Invitation"; $("#gs").textContent = `${P.g.name}, ${P.b.name}, ${guest}`;
$("#back").innerHTML = ic("back"); $("#vid").innerHTML = ic("vid"); $("#tel").innerHTML = ic("tel"); $("#more").innerHTML = ic("more"); $("#send").innerHTML = ic("send");
const chat = $("#chat"), inp = $("#in"), ov = $("#ov"), app = $("#app");
const scrollEnd = () => requestAnimationFrame(() => (chat.scrollTop = chat.scrollHeight));
const vv = window.visualViewport;
function fit() { app.style.height = (vv ? vv.height : innerHeight) + "px"; app.style.top = (vv ? vv.offsetTop : 0) + "px"; scrollEnd(); }
vv && (vv.addEventListener("resize", fit), vv.addEventListener("scroll", fit)); addEventListener("resize", fit); fit();
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2800); }

/* ---------- tema terang/gelap + wallpaper ---------- */
const kawung = (c) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><g fill='none' stroke='${c}' stroke-width='1.3'><ellipse cx='20' cy='20' rx='18' ry='8'/><ellipse cx='20' cy='20' rx='8' ry='18'/><ellipse cx='60' cy='60' rx='18' ry='8'/><ellipse cx='60' cy='60' rx='8' ry='18'/><circle cx='60' cy='20' r='3'/><circle cx='20' cy='60' r='3'/></g></svg>`)}`;
function setTheme(t) {
  root.dataset.theme = t; const d = t === "dark", w = C.wallpaper || {}, u = d ? w.dark : w.light;
  document.querySelector("meta[name=theme-color]").content = d ? "#1f2c34" : "#ffffff";
  app.style.backgroundImage = `url("${u || kawung(d ? "rgba(255,255,255,.07)" : "rgba(120,80,40,.17)")}")`; app.style.backgroundSize = w.size || "240px";
  $("#mt").innerHTML = ic(d ? "sun" : "moon", 22) + (d ? "Mode terang" : "Mode gelap");
}
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("#cover .pat").style.backgroundImage = `url("${kawung("rgba(255,215,140,.22)")}")`;

/* ---------- audio: musik latar berhenti saat VN/telepon, nyala lagi setelah selesai ---------- */
const bgm = new Audio(C.audio.bgm); bgm.loop = true; bgm.volume = 0.5;
let opened = false, musicOn = true, vnOn = false, callOn = false, volTold = false;
const syncBgm = () => (opened && musicOn && !vnOn && !callOn ? bgm.play().catch(() => {}) : bgm.pause());
function volHint(a) { if (!volTold || a.muted || a.volume < 0.3) { toast("Nyalakan dan besarkan volume HP-mu ya, biar suaranya kedengeran"); volTold = true; } }
let cur = null;
function stopVoice() { if (!cur) return; cur.a.pause(); cur.btn.innerHTML = ic("play"); cur.bars.forEach((b) => b.classList.remove("pl")); cur = null; vnOn = false; syncBgm(); }
function startVoice(url, btn, bars) {
  stopVoice(); const a = new Audio(url); cur = { a, btn, bars }; vnOn = true; syncBgm(); volHint(a); btn.innerHTML = ic("pause");
  a.ontimeupdate = () => bars.forEach((b, i) => b.classList.toggle("pl", i / bars.length < a.currentTime / (a.duration || 1)));
  a.onended = stopVoice; a.play().catch(() => stopVoice());
}
const menu = $("#menu");
$("#more").onclick = (e) => { e.stopPropagation(); $("#mm").innerHTML = ic(musicOn ? "off" : "on", 22) + (musicOn ? "Matikan musik" : "Nyalakan musik"); menu.hidden = !menu.hidden; };
document.addEventListener("click", () => (menu.hidden = true));
$("#mm").onclick = () => { musicOn = !musicOn; syncBgm(); };
$("#mg").innerHTML = ic("group", 22) + "Info grup";
$("#mt").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
$("#mg").onclick = () => $("#grp").click();
$("#back").onclick = () => toast("Kamu sudah di dalam undangan 😄");

/* ---------- chat ---------- */
const clock = () => new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(".", ":");
let last = null;
function msg(who, content) {
  const out = who === "me", p = P[who], first = last !== who; last = who;
  const r = h("div", `row ${out ? "out" : "in"}${first ? " first" : ""}`), b = h("div", `bub${first ? " tl" : ""}`);
  if (!out) {
    if (first) { const a = h("img", "av"); a.src = p.avatar; a.alt = p.name; a.onclick = () => story(p); r.append(a); const n = h("div", "nm", esc(p.name)); n.style.color = p.col; b.append(n); }
    else r.append(h("span", "sp0"));
  }
  if (typeof content === "string") { const t = h("div", "t"); t.textContent = content; b.append(t); } else b.append(content);
  b.append(h("span", "meta", `${clock()}${out ? `<span class="tick">${ic("ok", 17)}</span>` : ""}`));
  b.ondblclick = () => { if (!b.querySelector(".react")) { b.append(h("span", "react", "❤️")); b.style.marginBottom = "12px"; } };
  r.append(b); chat.append(r); scrollEnd(); return r;
}
function typing(who) {
  const p = P[who], first = last !== who, r = h("div", "row in typing" + (first ? " first" : ""));
  r.innerHTML = (first ? `<img class="av" src="${p.avatar}" alt="">` : `<span class="sp0"></span>`) + `<div class="bub${first ? " tl" : ""}"><div class="dots"><i></i><i></i><i></i></div></div>`;
  chat.append(r); scrollEnd(); $("#gs").textContent = `${p.name} sedang mengetik…`;
  return () => { r.remove(); $("#gs").textContent = `${P.g.name}, ${P.b.name}, ${guest}`; };
}
async function say(who, content, ms = 800) { const done = typing(who); await sleep(ms); done(); return msg(who, content); }
function sep(text, cls) { const c = h("div", "chip " + (cls || ""), text); chat.append(c); last = null; return c; }

/* ---------- konten pesan ---------- */
const cds = [];
function infoCard() {
  const c = h("div", "inv");
  c.innerHTML = `<div class="ban" style="--img:url(${C.cover})"><small>PERNIKAHAN</small><h3>${esc(GROUP)}</h3><p>${E.dateText}</p></div>
  <div class="rw"><span class="ms">schedule</span><div>${E.timeText}</div></div><div class="rw"><span class="ms">location_on</span><div>${E.venue}</div></div>
  <div class="rw"><span class="ms">palette</span><div>Tema ${E.theme}</div></div>
  <div class="cd"><div><b>00</b><small>Hari</small></div><div><b>00</b><small>Jam</small></div><div><b>00</b><small>Menit</small></div><div><b>00</b><small>Detik</small></div></div>`;
  cds.push(c.querySelectorAll(".cd b")); tick(); return c;
}
function tick() {
  const d = Math.max(0, new Date(E.iso) - Date.now()) / 1000, v = [d / 86400, (d % 86400) / 3600, (d % 3600) / 60, d % 60].map(Math.floor);
  cds.forEach((n) => n.forEach((el, i) => (el.textContent = String(v[i]).padStart(2, "0")))); $("#pe").textContent = `${Math.ceil(d / 86400)} hari lagi`;
}
setInterval(tick, 1000);
function mapCard() {
  const q = encodeURIComponent(E.mapQuery), c = h("div", "map");
  c.innerHTML = `<iframe loading="lazy" title="Peta lokasi" src="https://maps.google.com/maps?q=${q}&output=embed"></iframe><div class="rw"><span class="ms">location_on</span><div>${E.venue}</div></div><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Buka di Google Maps</a>`;
  return c;
}
function vnNode(p) {
  const n = h("div", "vn"), hs = [8, 16, 11, 22, 14, 26, 10, 18, 24, 12, 20, 9, 25, 15, 21, 11, 17, 23, 13, 19, 8, 22, 14, 10];
  n.innerHTML = `<button class="pb" aria-label="Putar pesan suara">${ic("play")}</button><div class="wave">${hs.map((x) => `<i style="height:${x}px"></i>`).join("")}</div><small>VN</small><img src="${p.avatar}" alt="">`;
  const btn = n.querySelector(".pb"), bars = [...n.querySelectorAll(".wave i")], dur = n.querySelector("small");
  const m = new Audio(); m.preload = "metadata"; m.src = p.vn; m.onloadedmetadata = () => { const s = Math.round(m.duration); dur.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  btn.onclick = () => (cur && cur.btn === btn ? stopVoice() : startVoice(p.vn, btn, bars));
  return n;
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); } catch { const a = h("textarea"); a.value = t; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Nomor rekening disalin");
}
function giftNode() {
  const w = h("div");
  (C.gifts || []).forEach((g) => {
    const c = h("div", "bank"); c.style.setProperty("--c1", g.colors[0]); c.style.setProperty("--c2", g.colors[1]); if (g.accent) c.style.setProperty("--ac", g.accent);
    c.innerHTML = `<div class="bt"><div><span class="bn">${esc(g.bank)}</span><small>${esc(g.who || "")}</small></div><i class="chipi"></i></div><div class="num">${esc(g.number).replace(/(\d{4})(?=\d)/g, "$1 ")}</div><div class="bb"><div><small>Atas nama</small><b>${esc(g.name)}</b></div><button class="cp">${ic("copy", 15)}Salin</button></div>`;
    c.querySelector(".cp").onclick = () => copy(g.number); w.append(c);
  });
  return w;
}

/* ---------- AI (service milikmu) ---------- */
const hist = []; let turn = 0, waiting = false;
const GIFT = /hadiah|kado|rekening|\brek\b|transfer|\btf\b|amplop|angpao|ang pao|\bgift|e-?wallet|\bdana\b|gopay|\bovo\b|qris|norek|no\.? ?rek/i;
async function getAIReply(userInput, who, gift) {
  const sys = `Kamu adalah ${GROUP}, pasangan pengantin yang sedang membalas chat tamu undangan. Saat ini yang membalas adalah ${who.name} (mempelai ${who.k === "g" ? "pria" : "wanita"}); bicara sebagai "aku" dan boleh menyebut pasanganmu ("${who.k === "g" ? P.b.name : P.g.name}") sesekali. Jangan menulis nama pengirim di awal pesan.

Gaya bahasa:
- santai, hangat, seperti chat WhatsApp
- tidak kaku, tidak terlalu formal
- tidak alay, hindari emoji berlebihan (maksimal 1 jika perlu)

Sapa tamu dengan nama: ${guest}

Info acara:
- ${E.dateText}
- Jam ${E.timeText}
- ${E.venue}
- Tema: ${E.theme}

Pengetahuan tambahan tentang acara (jawab berdasarkan ini, jangan mengarang di luar ini; kalau infonya tidak ada, bilang nanti akan dikabari atau sarankan tamu menghubungi mempelai langsung):
${(C.kb || []).map((x) => "- " + x).join("\n")}

Panduan jawab:
- Jawab singkat, jelas, dan tetap ramah
- Kalau ditanya detail → jawab langsung tanpa bertele-tele
- Kalau dikasih ucapan → balas dengan hangat dan terima kasih
- Kalau bilang hadir → respon dengan senang
- Kalau tidak bisa hadir → respon dengan pengertian
- Kalau di luar konteks → arahkan pelan ke topik acara
${gift ? "- Tamu sedang menanyakan hadiah/rekening. Balas 1-2 kalimat hangat (kehadiran dan doa sudah cukup, hadiah tidak wajib). JANGAN menulis nomor rekening, karena kartu rekening dikirim terpisah setelah balasanmu.\n" : ""}
Gunakan gaya seperti ngobrol biasa, jangan seperti customer service.`;
  try {
    const res = await fetch(C.ai.endpoint, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: C.ai.model, messages: [{ role: "system", content: sys }, ...hist.slice(-8), { role: "user", content: userInput }] }) });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || "Maaf, aku belum bisa jawab itu 😅";
    hist.push({ role: "user", content: userInput }, { role: "assistant", content: reply }); return reply;
  } catch (e) { console.error(e); return "Duh, sinyalku lagi bermasalah. Coba kirim lagi ya 🙏"; }
}
async function send() {
  const v = inp.value.trim(); if (!v || waiting) return; inp.value = ""; waiting = true; $("#send").disabled = true;
  const m = msg("me", v), who = turn++ % 2 ? "b" : "g", gift = GIFT.test(v); await sleep(500); const done = typing(who);
  const [reply] = await Promise.all([getAIReply(v, P[who], gift), sleep(1200)]);
  done(); m.classList.add("read"); msg(who, reply);
  if (gift) await say(who, giftNode(), 700);
  waiting = false; $("#send").disabled = false;
  if (/selamat|congrat|barakallah/i.test(v)) rain();
}
$("#send").onpointerdown = (e) => e.preventDefault(); // jaga keyboard tetap terbuka
$("#send").onclick = send;
// BUG FIX: sebelumnya `onkeydown = e => e.key==="Enter" && send()` mengembalikan false untuk tombol lain, sehingga mengetik diblokir di laptop.
inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send(); } });
function rain() { for (let i = 0; i < 18; i++) { const s = h("span", "fall", ["💚", "🎉", "🤍", "✨"][i % 4]); s.style.left = Math.random() * 100 + "vw"; s.style.animationDelay = Math.random() * 0.8 + "s"; document.body.append(s); setTimeout(() => s.remove(), 3600); } }

/* ---------- overlay: galeri, story, telepon ---------- */
let clean = null;
function openOv(cls) { ov.className = cls || ""; ov.innerHTML = ""; ov.hidden = false; return ov; }
function closeOv() { clean && clean(); clean = null; ov.hidden = true; ov.innerHTML = ""; syncBgm(); }
const full = (s) => s.replace(/\/\d+\/\d+$/, "/1200/1200");
const big = (src) => ov.append(h("div", "big", `<img src="${full(src)}" alt=""><button aria-label="Tutup">${ic("x")}</button>`));
function ovClick(e) {
  if (e.target.closest(".big")) return ov.querySelector(".big").remove();
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  if (a === "close") closeOv(); else if (a === "info") groupInfo(); else if (a === "grid") mediaGrid();
  else if (a === "photo") big(C.groupPhoto); else if (a === "storyg") story(P.g); else if (a === "storyb") story(P.b);
  else if (a.startsWith("big")) big(C.gallery[+a.slice(3)]);
}
function groupInfo() {
  openOv(); ov.onclick = ovClick;
  const mem = [[P.g, "Mempelai pria"], [P.b, "Mempelai wanita"]].map(([p, r]) => `<button class="mb" data-a="story${p.k}"><img src="${p.avatar}" alt=""><div><b>${esc(p.name)}</b><small>${r}</small></div></button>`).join("");
  ov.innerHTML = `<div class="oh"><button data-a="close" aria-label="Kembali">${ic("back")}</button><span>Info grup</span></div><div class="gi">
    <div class="gtop"><img class="gp" data-a="photo" src="${C.groupPhoto}" alt="Foto grup"><h2>Wedding Invitation ${esc(GROUP)}</h2><p>Grup · 3 anggota</p></div>
    <div class="sec"><div class="sh2"><b>Media, tautan, dan dokumen</b><button data-a="grid">${C.gallery.length}${ic("chev", 20)}</button></div><div class="strip">${C.gallery.slice(0, 8).map((s, i) => `<img src="${s}" data-a="big${i}" loading="lazy" alt="Foto ${i + 1}">`).join("")}</div></div>
    <div class="sec"><b class="cap">3 anggota</b>${mem}<div class="mb"><span class="ini">${esc(guest[0].toUpperCase())}</span><div><b>${esc(guest)} (Kamu)</b><small>Tamu undangan</small></div></div></div></div>`;
}
function mediaGrid() {
  ov.innerHTML = `<div class="oh"><button data-a="info" aria-label="Kembali">${ic("back")}</button><span>Media (${C.gallery.length})</span></div><div class="grid">${C.gallery.map((s, i) => `<img src="${s}" data-a="big${i}" loading="lazy" alt="Foto ${i + 1}">`).join("")}</div>`;
}
$("#grp").onclick = groupInfo;
function story(p) {
  let i = 0, t; openOv("blk"); const n = p.story.length;
  const draw = () => {
    clearTimeout(t); ov.innerHTML = `<div class="bars">${p.story.map((_, k) => `<i class="${k < i ? "d" : k === i ? "a" : ""}"><b></b></i>`).join("")}</div><div class="sh"><img src="${p.avatar}" alt=""><b>${esc(p.name)}</b><span>Hari ini</span><button data-a="x" aria-label="Tutup">${ic("x")}</button></div><div class="story"><img class="sp" src="${p.story[i]}" alt=""><u class="l" data-a="p"></u><u class="r" data-a="n"></u></div>`;
    t = setTimeout(next, 4500);
  };
  const next = () => (i + 1 < n ? (i++, draw()) : closeOv());
  ov.onclick = (e) => { const a = e.target.closest("[data-a]")?.dataset.a; if (a === "x") closeOv(); else if (a === "n") next(); else if (a === "p") { i = Math.max(0, i - 1); draw(); } };
  clean = () => clearTimeout(t); draw();
}
function call(video) {
  openOv("blk"); callOn = true; syncBgm(); let media, timer, sec = 0;
  const people = video ? "" : `<div class="av2"><img src="${P.g.avatar}" alt=""><img src="${P.b.avatar}" alt=""></div>`;
  ov.innerHTML = `<div class="call ring"><div class="cb" style="background-image:url(${P.b.avatar})"></div>${video ? `<video playsinline></video>` : ""}<div class="top"><h2>${esc(GROUP)}</h2><p id="cs">${video ? "Video call… memanggil" : "Memanggil…"}</p></div>${people}<div class="ctl"><button>${ic("mic", 24)}</button><button>${ic("vol", 24)}</button><button class="end" aria-label="Akhiri">${ic("end", 28)}</button></div></div>`;
  const cs = $("#cs"), end = () => closeOv(); ov.querySelector(".end").onclick = end;
  const w = setTimeout(() => {
    media = video ? ov.querySelector("video") : new Audio(); media.src = video ? C.video.call : C.audio.voiceCall; volHint(media);
    ov.querySelector(".call").classList.remove("ring"); cs.textContent = "00:00";
    timer = setInterval(() => { sec++; cs.textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; }, 1000);
    media.onended = () => { clearInterval(timer); cs.textContent = "Panggilan berakhir"; setTimeout(end, 1200); }; media.play().catch(() => (cs.textContent = "Ketuk layar untuk memutar"));
  }, 2200);
  clean = () => { clearInterval(timer); clearTimeout(w); media && media.pause(); callOn = false; };
}
$("#tel").onclick = () => call(false); $("#vid").onclick = () => call(true);

/* ---------- buka undangan ---------- */
let infoRow;
$("#pin").onclick = () => { if (!infoRow) return; infoRow.scrollIntoView({ behavior: "smooth", block: "center" }); infoRow.classList.add("flash"); setTimeout(() => infoRow.classList.remove("flash"), 1300); };
$("#open").onclick = async () => {
  opened = true; syncBgm(); $("#cover").classList.add("gone"); volHint(bgm);
  sep("HARI INI"); sep(ic("lock", 14) + " Pesan di grup ini hanya bisa dibaca kamu, " + P.g.name + ", dan " + P.b.name + ".", "y").onclick = () => toast("Tenang, nggak ada yang nyadap 😄");
  await sleep(600);
  await say("g", `Halo ${guest}.`, 600);
  await say("b", `Makasih ya sudah mampir ke undangan kami.`);
  await say("g", `Kami mau ngabarin, kami akan menikah pada ${E.dateText}. Kalau kamu sempat, kami senang banget kalau kamu bisa datang.`, 1300);
  await say("b", `Ini detail acaranya.`, 600);
  infoRow = await say("b", infoCard(), 700); $("#pt").textContent = `${E.dateText} · ${E.timeText}`; $("#pin").hidden = false;
  await say("g", mapCard(), 700);
  await say("b", `Kami juga rekam pesan suara buat kamu. Sempetin didengerin ya.`, 1100);
  await say("g", vnNode(P.g), 700);
  await say("b", vnNode(P.b), 700);
  await say("g", `Kamu bisa konfirmasi kehadiran lewat tombol di bawah, atau tulis pertanyaan apa aja di sini. Nanti kami jawab.`, 1000);
  const qr = $("#qr"); (C.quick || []).forEach((q) => { const b = h("button", "qb"); b.textContent = q; b.onclick = () => { if (waiting) return; inp.value = q; b.remove(); if (!qr.children.length) qr.hidden = true; send(); }; qr.append(b); }); qr.hidden = false; fit();
};
document.addEventListener("visibilitychange", () => (document.hidden ? bgm.pause() : syncBgm()));
</script>
</body>
